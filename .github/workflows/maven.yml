# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # 배포 관련 단계는 main에 push했을 때만 실행한다 (PR은 빌드만 확인)
      # 서비스 키가 없으면 배포된 앱의 모든 검색이 실패하므로, 빌드·배포 전에 멈춘다
      - name: Check secrets
        if: github.event_name == 'push'
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            echo "::error::GitHub Secrets에 DATA_GO_KR_SERVICE_KEY가 없습니다. (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      #    - name: Update dependency graph
      #      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

      #    - uses: actions/checkout@v4
      # 저장소의 deploy/startup.sh로 처음 교체하기 전에, 서버에 있던 원래 스크립트를 한 번만 백업한다
      - name: backup original startup.sh
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID}}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ~/fly-schedule
            if [ -f ~/fly-schedule/startup.sh ] && [ ! -f ~/fly-schedule/startup.sh.orig ]; then
              cp ~/fly-schedule/startup.sh ~/fly-schedule/startup.sh.orig
            fi

      - name: upload startup.sh
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID}}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy/startup.sh"
          target: "~/fly-schedule"
          strip_components: 1
          rm: false

      - name: upload file
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID}}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "target/fly.jar"
          target: "~/fly-schedule"
          rm: false

      - name: run-script
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID}}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          # 키를 원격 셸의 환경 변수로 넘긴다 (startup.sh가 실행하는 java 프로세스가 물려받음)
          # GOOGLE_GENAI_API_KEY는 선택이다. Secret이 없으면 빈 값으로 넘어오고, startup.sh가 지운다
          envs: DATA_GO_KR_SERVICE_KEY,GOOGLE_GENAI_API_KEY
          script: |
            chmod +x ./fly-schedule/startup.sh
            ./fly-schedule/startup.sh