version: '3.8'

services:
  flyschedule:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flyschedule
    ports:
      - "8080:8080"
    environment:
      # Spring AI Ollama 설정
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL=qwen2.5:1.5b
      - SPRING_AI_OLLAMA_CHAT_OPTIONS_TEMPERATURE=0.0
      - SPRING_HTTP_CLIENT_READ_TIMEOUT=300s

      # Spring AI Gemini 설정
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY}
      - SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL=gemini-2.5-flash
      - SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_TEMPERATURE=0.0

      # 공공데이터 포털 API 설정
      - DATA_GO_KR_SERVICE_KEY=${DATA_GO_KR_SERVICE_KEY}

      # 서버 설정
      - SERVER_PORT=8080
      - SERVER_TOMCAT_CONNECTIONTIMEOUT=300000

      # 로그 레벨
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AI=DEBUG
      - LOGGING_LEVEL_NET_JAVA21_FLYSCHEDULE=DEBUG
    depends_on:
      - ollama
    networks:
      - flyschedule-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - flyschedule-network
    restart: unless-stopped

volumes:
  ollama-data:
    driver: local

networks:
  flyschedule-network:
    driver: bridge
