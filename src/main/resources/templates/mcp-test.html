<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP & A2A 항공편 검색</title>

    <!-- Tabler.io CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/css/tabler.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>

    <style>
        :root {
            --tblr-font-sans-serif: 'Inter', -apple-system, BlinkMacSystemFont, San Francisco, Segoe UI, Roboto, Helvetica Neue, sans-serif;
        }
        body {
            font-feature-settings: "cv03", "cv04", "cv11";
        }
        .card {
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-overlay.active {
            display: flex;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #206bc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #666;
        }
        .response-card {
            margin-top: 20px;
        }
        .airline-group {
            margin-bottom: 20px;
        }
        .flight-item {
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #206bc4;
        }
        .flight-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2fb344;
        }
        .flight-time {
            font-size: 1.1rem;
            color: #495057;
        }
        .badge-airline {
            font-size: 0.9rem;
            padding: 8px 12px;
        }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .quick-btn {
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Header -->
        <header class="navbar navbar-expand-md navbar-dark d-print-none bg-primary">
            <div class="container-xl">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <h1 class="navbar-brand navbar-brand-autodark">
                    <a href="/">
                        <i class="ti ti-plane text-white me-2"></i>
                        항공 스케줄 MCP 서버
                    </a>
                </h1>
            </div>
        </header>

        <div class="page-wrapper">
            <!-- Page body -->
            <div class="page-body">
                <div class="container-xl">
                    <!-- Page title -->
                    <div class="page-header d-print-none">
                        <div class="col-auto ms-auto d-print-none">
                            <span class="d-none d-sm-inline">
                                <a href="/" class="btn btn-white">
                                    <i class="ti ti-home me-1"></i>
                                    메인으로
                                </a>
                            </span>
                        </div>
                    </div>

                    <!-- Main Cards -->
                    <div class="row row-deck row-cards">
                        <!-- 항공편 검색 카드 -->
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">
                                        <i class="ti ti-plane me-2"></i>
                                        항공편 검색 (MCP Tool)
                                    </h3>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">빠른 검색</label>
                                        <div>
                                            <button class="btn btn-primary quick-btn" onclick="fillBasicSearch()">
                                                <i class="ti ti-search me-1"></i>기본 검색
                                            </button>
                                            <button class="btn btn-info quick-btn" onclick="fillTimeSearch()">
                                                <i class="ti ti-clock me-1"></i>오후 2시 이후
                                            </button>
                                            <button class="btn btn-success quick-btn" onclick="fillPriceSearch()">
                                                <i class="ti ti-discount me-1"></i>3~7만원
                                            </button>
                                        </div>
                                    </div>

                                    <form id="flightSearchForm">
                                        <div class="row">
                                            <div class="col-md-4 mb-3">
                                                <label class="form-label">출발 공항</label>
                                                <select class="form-select" id="departure" name="departure">
                                                    <option value="광주">광주</option>
                                                    <option value="김포">김포</option>
                                                    <option value="김해">김해</option>
                                                    <option value="제주">제주</option>
                                                    <option value="대구">대구</option>
                                                    <option value="청주">청주</option>
                                                </select>
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <label class="form-label">도착 공항</label>
                                                <select class="form-select" id="arrival" name="arrival">
                                                    <option value="제주">제주</option>
                                                    <option value="광주">광주</option>
                                                    <option value="김포">김포</option>
                                                    <option value="김해">김해</option>
                                                    <option value="대구">대구</option>
                                                    <option value="청주">청주</option>
                                                </select>
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <label class="form-label">날짜</label>
                                                <input type="text" class="form-control" id="date" name="date"
                                                       placeholder="내일, 모레, 2026-03-10">
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label">기준 시간 (선택)</label>
                                                <input type="text" class="form-control" id="afterTime" name="afterTime"
                                                       placeholder="14:00 또는 오후 2시">
                                            </div>
                                            <div class="col-md-3 mb-3">
                                                <label class="form-label">최소 가격 (선택)</label>
                                                <input type="number" class="form-control" id="minPrice" name="minPrice"
                                                       placeholder="30000">
                                            </div>
                                            <div class="col-md-3 mb-3">
                                                <label class="form-label">최대 가격 (선택)</label>
                                                <input type="number" class="form-control" id="maxPrice" name="maxPrice"
                                                       placeholder="70000">
                                            </div>
                                        </div>
                                        <div class="d-flex">
                                            <button type="submit" class="btn btn-primary me-2">
                                                <i class="ti ti-search me-1"></i>검색
                                            </button>
                                            <button type="button" class="btn btn-outline-primary" onclick="searchFlights()">
                                                <i class="ti ti-api me-1"></i>API 호출
                                            </button>
                                        </div>
                                    </form>

                                    <!-- 결과 표시 영역 -->
                                    <div id="flightResult" class="response-card" style="display:none;"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 공항 정보 카드 -->
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">
                                        <i class="ti ti-building me-2"></i>
                                        공항 정보
                                    </h3>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <button class="btn btn-primary me-2" onclick="getAirportList()">
                                            <i class="ti ti-list me-1"></i>전체 공항 목록
                                        </button>
                                        <button class="btn btn-outline-primary" onclick="getAirportCode()">
                                            <i class="ti ti-search me-1"></i>공항 코드 조회
                                        </button>
                                    </div>
                                    <div class="mb-3">
                                        <input type="text" class="form-control" id="airportName"
                                               placeholder="공항 이름 (코드 조회용, 예: 광주, 김포, 제주)">
                                    </div>
                                    <div id="airportResult" class="response-card" style="display:none;"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 항공사 정보 카드 -->
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">
                                        <i class="ti ti-plane me-2"></i>
                                        항공사 정보
                                    </h3>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <button class="btn btn-primary me-2" onclick="getAirlineList()">
                                            <i class="ti ti-list me-1"></i>전체 항공사 목록
                                        </button>
                                        <button class="btn btn-outline-primary" onclick="getAirlineId()">
                                            <i class="ti ti-search me-1"></i>항공사 ID 조회
                                        </button>
                                    </div>
                                    <div class="mb-3">
                                        <input type="text" class="form-control" id="airlineName"
                                               placeholder="항공사 이름 (ID 조회용, 예: 아시아나항공, 대한항공)">
                                    </div>
                                    <div id="airlineResult" class="response-card" style="display:none;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="text-center">
            <div class="spinner"></div>
            <div class="loading-text">
                <i class="ti ti-rotating me-2"></i>
                AI가 처리 중입니다... 잠시만 기다려주세요.
            </div>
        </div>
    </div>

    <!-- Tabler.io JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/js/tabler.min.js"></script>

    <script>
        const API_BASE = '/api/mcp';

        // 빠른 채우기 함수
        function fillBasicSearch() {
            document.getElementById('departure').value = '광주';
            document.getElementById('arrival').value = '제주';
            document.getElementById('date').value = '내일';
            document.getElementById('afterTime').value = '';
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
        }

        function fillTimeSearch() {
            fillBasicSearch();
            document.getElementById('afterTime').value = '14:00';
        }

        function fillPriceSearch() {
            fillBasicSearch();
            document.getElementById('minPrice').value = '30000';
            document.getElementById('maxPrice').value = '70000';
        }

        // 로딩 표시
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // 항공편 검색
        async function searchFlights() {
            const departure = document.getElementById('departure').value;
            const arrival = document.getElementById('arrival').value;
            const date = document.getElementById('date').value || '내일';
            const afterTime = document.getElementById('afterTime').value;
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;

            let url = `${API_BASE}/flights/search?departure=${encodeURIComponent(departure)}&arrival=${encodeURIComponent(arrival)}&date=${encodeURIComponent(date)}`;

            if (afterTime) {
                url = `${API_BASE}/flights/search/time?departure=${encodeURIComponent(departure)}&arrival=${encodeURIComponent(arrival)}&date=${encodeURIComponent(date)}&afterTime=${encodeURIComponent(afterTime)}`;
            }

            if (minPrice || maxPrice) {
                url = `${API_BASE}/flights/search/price?departure=${encodeURIComponent(departure)}&arrival=${encodeURIComponent(arrival)}&date=${encodeURIComponent(date)}`;
                if (minPrice) url += `&minPrice=${minPrice}`;
                if (maxPrice) url += `&maxPrice=${maxPrice}`;
            }

            await callAPI('flight', url, formatFlightResults);
        }

        // 항공편 결과 포맷팅
        function formatFlightResults(data) {
            if (!data.success) {
                return `<div class="alert alert-danger">
                    <i class="ti ti-alert-circle me-2"></i>
                    ${data.message}
                </div>`;
            }

            const flights = data.data;
            const airlines = Object.keys(flights);

            if (airlines.length === 0) {
                return `<div class="alert alert-warning">
                    <i class="ti ti-alert-triangle me-2"></i>
                    검색 결과가 없습니다.
                </div>`;
            }

            let html = '<div class="alert alert-success mb-3">';
            html += `<i class="ti ti-check me-2"></i>`;
            html += `총 ${airlines.length}개 항공사에서 항공편을 찾았습니다.`;
            html += '</div>';

            // 검색 날짜 표시 (첫 번째 항공편에서 날짜 추출)
            const firstAirline = airlines[0];
            const firstFlight = flights[firstAirline][0];
            if (firstFlight && firstFlight.depPlandTime) {
                const dateStr = firstFlight.depPlandTime.substring(0, 8); // YYYYMMDD
                const formattedDate = `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
                html += `<div class="alert alert-info mb-3">
                    <i class="ti ti-calendar me-2"></i>
                    <strong>검색 날짜:</strong> ${formattedDate}
                </div>`;
            }

            airlines.forEach(airline => {
                const flightList = flights[airline];
                html += '<div class="airline-group">';
                html += `<h4 class="mb-3">
                    <span class="badge bg-primary badge-airline">
                        <i class="ti ti-plane me-1"></i>${airline}
                    </span>
                    <span class="badge bg-secondary">${flightList.length}편</span>
                </h4>`;

                flightList.forEach(flight => {
                    // API 응답 필드명에 맞춰 수정
                    // 시간 포맷: 0935 → 09:35
                    const depTimeRaw = flight.depPlandTime ? flight.depPlandTime.substring(8, 12) : '';
                    const arrTimeRaw = flight.arrPlandTime ? flight.arrPlandTime.substring(8, 12) : '';
                    const depTime = depTimeRaw ? `${depTimeRaw.substring(0, 2)}:${depTimeRaw.substring(2, 4)}` : '';
                    const arrTime = arrTimeRaw ? `${arrTimeRaw.substring(0, 2)}:${arrTimeRaw.substring(2, 4)}` : '';
                    const price = flight.economyCharge ? flight.economyCharge.toLocaleString() + '원' : '가격 정보 없음';
                    const flightId = flight.vihicleId || '';

                    html += '<div class="flight-item">';
                    html += `<div class="d-flex justify-content-between align-items-center">`;
                    html += `<div>
                        <div class="flight-time mb-1">
                            <i class="ti ti-plane-departure me-1"></i>
                            ${depTime} → ${arrTime}
                        </div>
                        <small class="text-muted">${flightId}</small>
                    </div>`;
                    html += `<div class="text-end">
                        <div class="flight-price">${price}</div>
                    </div>`;
                    html += `</div></div>`;
                });

                html += '</div><hr>';
            });

            return html;
        }

        // 공항 목록 조회
        async function getAirportList() {
            await callAPI('airport', `${API_BASE}/airports`, formatAirportList);
        }

        // 공항 목록 포맷팅
        function formatAirportList(data) {
            if (!data.success) {
                return `<div class="alert alert-danger">${data.message}</div>`;
            }

            const airports = data.data;
            let html = '<div class="alert alert-success">';
            html += `<i class="ti ti-building me-2"></i>총 ${airports.length}개 공항</div>`;
            html += '<div class="row g-2">';

            airports.forEach(airport => {
                html += `<div class="col-6 col-md-4">
                    <div class="p-2 border rounded">
                        <div class="fw-bold">${airport.airportName || ''}</div>
                        <small class="text-muted">${airport.airportId || ''}</small>
                    </div>
                </div>`;
            });

            html += '</div>';
            return html;
        }

        // 공항 코드 조회
        async function getAirportCode() {
            const airportName = document.getElementById('airportName').value;
            if (!airportName) {
                alert('공항 이름을 입력해주세요.');
                return;
            }
            await callAPI('airport', `${API_BASE}/airports/code?airportName=${encodeURIComponent(airportName)}`, formatAirportCode);
        }

        // 공항 코드 포맷팅
        function formatAirportCode(data) {
            if (!data.success) {
                return `<div class="alert alert-danger">${data.message}</div>`;
            }

            const result = data.data;
            return `<div class="alert alert-success">
                <i class="ti ti-check me-2"></i>
                <strong>${result.airportName || ''}</strong>의 코드: <code>${result.airportCode || ''}</code>
            </div>`;
        }

        // 항공사 목록 조회
        async function getAirlineList() {
            await callAPI('airline', `${API_BASE}/airlines`, formatAirlineList);
        }

        // 항공사 목록 포맷팅
        function formatAirlineList(data) {
            if (!data.success) {
                return `<div class="alert alert-danger">${data.message}</div>`;
            }

            const airlines = data.data;
            let html = '<div class="alert alert-success">';
            html += `<i class="ti ti-plane me-2"></i>총 ${airlines.length}개 항공사</div>`;
            html += '<div class="row g-2">';

            airlines.forEach(airline => {
                html += `<div class="col-6 col-md-4">
                    <div class="p-2 border rounded">
                        <div class="fw-bold">${airline.airlineName || ''}</div>
                        <small class="text-muted">${airline.airlineId || ''}</small>
                    </div>
                </div>`;
            });

            html += '</div>';
            return html;
        }

        // 항공사 ID 조회
        async function getAirlineId() {
            const airlineName = document.getElementById('airlineName').value;
            if (!airlineName) {
                alert('항공사 이름을 입력해주세요.');
                return;
            }
            await callAPI('airline', `${API_BASE}/airlines/id?airlineName=${encodeURIComponent(airlineName)}`, formatAirlineId);
        }

        // 항공사 ID 포맷팅
        function formatAirlineId(data) {
            if (!data.success) {
                return `<div class="alert alert-danger">${data.message}</div>`;
            }

            const result = data.data;
            return `<div class="alert alert-success">
                <i class="ti ti-check me-2"></i>
                <strong>${result.airlineName || ''}</strong>의 ID: <code>${result.airlineId || ''}</code>
            </div>`;
        }

        // 공통 API 호출 함수
        async function callAPI(type, url, formatFunc) {
            const resultDiv = document.getElementById(`${type}Result`);
            showLoading();
            resultDiv.style.display = 'none';

            try {
                const response = await fetch(url);
                const data = await response.json();

                resultDiv.innerHTML = formatFunc ? formatFunc(data) : `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                resultDiv.style.display = 'block';
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">
                    <i class="ti ti-alert-circle me-2"></i>
                    에러: ${error.message}
                </div>`;
                resultDiv.style.display = 'block';
            } finally {
                hideLoading();
            }
        }

        // 폼 제출 이벤트
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('flightSearchForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    searchFlights();
                });
            }

            // 초기화
            fillBasicSearch();
        });
    </script>
</body>
</html>
